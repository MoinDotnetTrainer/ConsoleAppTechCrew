<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>

    <!--Forms tag UI elements
    textbox ,etc-->
    <form>
        <fieldset>
            <table border="1">

                <tr>
                    <td>Name</td>
                    <td>
                        <input type="text" placeholder="Name Here" required readonly />
                    </td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>
                        <input type="email" required disabled />
                    </td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>
                        <input type="password" required />
                    </td>
                </tr>

                <tr>
                    <td>Address</td>
                    <td>
                        <textarea></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Dob</td>
                    <td>
                        <input type="datetime-local" />
                    </td>
                </tr>

                <tr>
                    <td>Salary</td>
                    <td>
                        <input type="number" />
                    </td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gender" /> Male |
                        <input type="radio" name="gender" /> Female
                    </td>
                </tr>

                <tr>
                    <td>Qualification</td>
                    <td>
                        <input type="checkbox" name="qualification" /> +12 |
                        <input type="checkbox" name="qualification" /> B tech|
                        <input type="checkbox" name="qualification" /> M tech |
                        <input type="checkbox" name="qualification" /> MCA
                    </td>
                </tr>
                <tr>
                    <td>Dept</td>
                    <td>
                        <select>
                            <option>--Select--</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Sales">Sales</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Profile Pic</td>
                    <td>
                        <input type="file" />
                    </td>
                </tr>
                <tr>
                    <td>Month </td>
                    <td>
                        <input type="month">
                    </td>
                </tr>
                <tr>
                    <td>Range </td>
                    <td>
                        <input type="range" min="0" max="100">
                    </td>
                </tr>
                <tr>
                    <td><label>Hidden</label> </td>
                    <td>
                        <input type="hidden" value="100">
                    </td>
                </tr>
                <tr>
                    <td>Week </td>
                    <td>
                        <input type="week">
                    </td>
                </tr>

                <tr>
                    <td>Fav Color</td>
                    <td>
                        <input type="color" />
                    </td>
                </tr>

                <tr>
                    <td>Web Site </td>
                    <td>
                        <input type="url" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="Save" />
                    </td>
                    <td>

                        <input type="reset" value="reset" />
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
